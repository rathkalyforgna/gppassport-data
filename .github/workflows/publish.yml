name: Publish

# Publishes tickets.json (and the Privacy Policy page) to GitHub Pages — tickets
# only after they pass validation, so a broken file never reaches the app. Runs
# on every push to main (your edits and merged review PRs) and is called by
# "Update tickets" after automatic updates.
on:
  push:
    branches: [main]
    paths: [tickets.json, legal/**, scripts/build_legal.py]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate tickets.json
        run: python3 scripts/validate.py tickets.json

      - name: Prepare site
        run: |
          mkdir -p _site
          cp tickets.json _site/
          # Legal pages are built only once finished (no DRAFT note or
          # [PLACEHOLDERS]); an unfinished page is skipped, never blocking tickets.
          python3 scripts/build_legal.py legal/privacy.md _site/privacy.html \
            || echo "::warning::privacy.html not published — finish legal/privacy.md first"
          python3 scripts/build_legal.py legal/terms.md _site/terms.html \
            || echo "::warning::terms.html not published — finish legal/terms.md first"
          python3 scripts/build_legal.py legal/support.md _site/support.html \
            || echo "::warning::support.html not published — finish legal/support.md first"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
